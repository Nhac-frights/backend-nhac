# Produção: nenhum secret possui fallback conhecido. O processo deve falhar
# durante o bootstrap quando uma variável obrigatória não for fornecida.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
api.security.token.secret=${JWT_SENHA}
google.client.id=${CLIENT_GOOGLE_ID}
twilio.account-sid=${TWILIO_SID}
twilio.auth-token=${AUTH_TOKEN}
twilio.from-number=${NUMBER}

stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
asaas.api.key=${ASAAS_API_KEY}
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN}
asaas.api.url=${ASAAS_API_URL:https://api.asaas.com/v3}

brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}

firebase.storage.bucket-name=${FIREBASE_STORAGE_BUCKET}
firebase.storage.credentials-path=
firebase.storage.credentials-base64=${FIREBASE_CREDENTIALS_BASE64}
nhac.storage.mock-mode=false
nhac.email.mock-mode=false
nhac.sms.mock-mode=false

spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
