spring.datasource.url=${E2E_DB_URL:jdbc:mariadb://localhost:3307/nhac_e2e?serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${E2E_DB_USER:nhac_e2e}
spring.datasource.password=${E2E_DB_PASSWORD:nhac_e2e}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=NhacE2EHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

api.security.token.secret=nhac-e2e-jwt-secret-exclusive-do-not-use-outside-tests

nhac.sms.mock-mode=true
nhac.email.mock-mode=true
nhac.storage.mock-mode=true
nhac.payments.mock-mode=true
nhac.routing.mock-mode=true
nhac.google.enabled=false

twilio.account-sid=
twilio.auth-token=
twilio.from-number=
brevo.api-key=
brevo.api-base-url=http://127.0.0.1:1
brevo.sender-email=e2e@nhac.local
brevo.sender-name=Nhac E2E
stripe.api.key=sk_test_e2e_mock
stripe.webhook.secret=whsec_e2e_mock
asaas.api.key=e2e_mock
asaas.webhook.token=e2e_mock
asaas.api.url=http://127.0.0.1:1
firebase.storage.bucket-name=e2e-disabled
firebase.storage.credentials-base64=
google.client.id=e2e-disabled

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
