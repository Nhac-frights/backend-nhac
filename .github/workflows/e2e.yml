name: E2E cliente

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/java/br/com/nhac/backend_nhac/config/E2EDataLoader.java'
      - 'src/main/java/br/com/nhac/backend_nhac/domain/auth/**'
      - 'src/main/java/br/com/nhac/backend_nhac/domain/entrega/**'
      - 'src/main/java/br/com/nhac/backend_nhac/domain/loja/**'
      - 'src/main/java/br/com/nhac/backend_nhac/domain/pedido/**'
      - 'src/main/java/br/com/nhac/backend_nhac/domain/produto/**'
      - 'src/main/java/br/com/nhac/backend_nhac/domain/usuario/**'
      - 'src/main/java/br/com/nhac/backend_nhac/infra/security/**'
      - 'src/main/resources/application-e2e.properties'
      - 'src/main/resources/db/migration/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-cliente-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  e2e:
    name: E2E-001 a E2E-004 (3x)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nhac_e2e
          MARIADB_USER: nhac_e2e
          MARIADB_PASSWORD: nhac_e2e
          MARIADB_ROOT_PASSWORD: nhac_e2e_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend-nhac

      - name: Checkout app E2E
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/Nhac
          ref: ${{ github.head_ref || github.ref_name }}
          path: Nhac

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-nhac/pom.xml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: Nhac
        run: flutter pub get

      - name: Run isolated Android E2E three times
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          RUN_E2E: 'true'
          E2E_DB_MANAGED: 'true'
          E2E_REPEAT: '3'
          E2E_DEVICE_ID: emulator-5554
          BACKEND_DIR: ${{ github.workspace }}/backend-nhac
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: Nhac
          script: ./tool/run_e2e.sh

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_number }}
          path: Nhac/build/e2e-logs
          if-no-files-found: warn
          retention-days: 14
